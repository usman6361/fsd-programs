<html>
    <head>
    <title>Form Validation</title>
    <script>
        function validate() {
            // Validation for Name
            if (myform.Name.value == "") {
                alert("Enter Name");
                return false;
            }
            // Validation for Email
            if (myform.EMail.value == "") {
                alert("Enter Email");
                return false;
            }
            // Validation for Zip (Checks if empty OR length is not 5)
            if (myform.Zip.value == "" || isNaN(myform.Zip.value) || myform.Zip.value.length != 5) {
                alert("Enter a 5 digit Zip");
                return false;
            }
            // Validation for Country
            if (myform.Country.value == "-1") {
                alert("Select Country");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <form name="myform" onsubmit="return validate()">
        <table border="1">
            <tr>
                <td>Name</td>
                <td><input name="Name"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input name="EMail"></td>
            </tr>
            <tr>
                <td>Zip code</td>
                <td><input name="Zip"></td>
            </tr>
            <tr>
                <td>Country</td>
                <td>
                    <select name="Country">
                        <option value="-1">Choose yours</option>
                        <option>USA</option>
                        <option>UK</option>
                        <option>INDIA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Submit"></td>
            </tr>
        </table>
    </form>
</body>
</html>
