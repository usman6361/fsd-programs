<html>
<body>
    <h2>Welcome to login form</h2>
    Username: <input id="email"><br><br>
    Password: <input type="password" id="pwd">
    <br><br>
    <button onclick="login()">Login</button>
    <button onclick="location.reload()">Reset</button>

    <script>
        function login() {
            // Note: The original notes had 'email.value' and 'pwd.value' directly,
            // but standard JavaScript requires getting the element first.
            let u = document.getElementById("email").value;
            let p = document.getElementById("pwd").value;

            if (!u) {
                alert("Please enter user name.");
            } else if (!p) {
                alert("Enter the password");
            } else if (!/^[^ ]+@[^ ]+\.[a-z]{2,3}$/.test(u)) {
                alert("Enter valid email id.");
            } else if (p.length != 6) {
                alert("Password min and max length is 6.");
            } else {
                alert("Thank you for login");
            }
        }
    </script>
</body>
</html>
