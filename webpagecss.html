<html>
<head>
<title> CSS Border Radius </title>
<style>
div {
    width : 250px ;
    height : 140px ;
    padding : 20px ;
}
.a {
    background : lightgreen ;
    border-radius : 90px ;
}
.b {
    background : orange ;
    border-radius : 25% 10% ;
}
.c {
    background : cyan ;
    border-radius : 35px 10em 10% ;
}
.d {
    background : lightblue ;
    border-radius : 50px 50% 50em 50em ;
}
</style>
</head>
<body>
<div class = "a"> <b> Welcome to the java </b>
    <p> border-radius : 90px ; </p> </div>
<div class = "b"> <b> Welcome to the H.M.S </b>
    <p> border-radius : 25% 10% ; </p> </div>
<div class = "c"> <b> Welcome to the H.M.S
polytechnic </b> <p> border-radius : 35px 10em 10% ; 
    </p> </div>
<div class = "d"> <b> Welcome to the Rumkun </b>
    <p> border-radius : 50px 50% 50em 50em ; </p>
    </div>
</body>
</html>
